apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sdp-secrets
  namespace: sdp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-backend
    kind: SecretStore
  target:
    name: sdp-secrets
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /sdp/prod/
      rewrite:
      - regexp:
          source: "^/sdp/prod/(.*)$"
          target: "$1"