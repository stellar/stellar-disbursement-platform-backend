apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sdp-secrets
  namespace: sdp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-backend
    kind: SecretStore
  target:
    name: sdp-secrets
    creationPolicy: Owner
  dataFrom:
    - find:
        name: 
          regexp: "^/sdp/dev/"
      rewrite:
        - regexp:
            source: "^/sdp/dev/(.*)$"
            target: "$1"