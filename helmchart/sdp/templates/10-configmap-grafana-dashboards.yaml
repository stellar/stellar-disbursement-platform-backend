{{- if .Values.grafanaDashboards.enabled -}}
# Provisions the committed Grafana dashboards (chart-vendored copies of
# resources/grafana/*.json) as a ConfigMap. The `grafana_dashboard: "1"` label is the
# convention the kube-prometheus-stack Grafana sidecar watches for auto-import. Source of
# truth for the JSON lives at the repo root under resources/grafana/; the copies under
# dashboards/ exist because Helm's .Files can only read files inside the chart directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sdp.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdp.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.grafanaDashboards.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
