version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus/
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - default
      - sdp

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml

volumes:
  grafana-storage:

networks:
  sdp:
    # SDP stack network, <project>_default; start the SDP first.
    external: true
    name: ${SDP_NETWORK:-sdp_default}